<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern UI Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hub-container" style="text-align: center; padding: 4rem 2rem; max-width: 1200px; margin: 0 auto;">
        <h1 style="font-size: 3.5rem; font-weight: 900; margin-bottom: 1rem;">
            Modern UI <span style="color: #10b981;">Show</span><span style="color: #f43f5e;">case</span>
        </h1>
        <p style="font-size: 1.2rem; color: #94a3b8; margin-bottom: 3rem;">
            Biblioteca modular de aprendizaje: explorando las corrientes de diseño web más vibrantes y atrevidas.
        </p>

        <!-- Contenedor dinámico donde se inyectarán las tarjetas automáticamente -->
        <div id="cards-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;">
            <!-- Las tarjetas se cargan solas aquí mediante JavaScript -->
        </div>
    </main>

    <script>
        // Al cargar la página, consultamos al backend los estilos disponibles
        fetch('/api/estilos')
            .then(response => response.json())
            .then(estilos => {
                const container = document.getElementById('cards-container');
                container.innerHTML = ''; // Limpiamos por si acaso

                estilos.forEach(estilo => {
                    // Creamos el enlace/tarjeta para cada archivo HTML encontrado
                    const card = document.createElement('a');
                    card.href = `/${estilo.archivo}`;
                    card.className = 'nav-card';
                    card.style.cssText = `
                        background: rgba(255, 255, 255, 0.05);
                        border: 1px solid rgba(255, 255, 255, 0.1);
                        border-radius: 16px;
                        padding: 2rem;
                        text-align: center;
                        text-decoration: none !important;
                        color: #ffffff !important;
                        font-weight: 700;
                        font-size: 1.2rem;
                        transition: all 0.3s ease;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                    `;
                    
                    card.textContent = estilo.nombre;

                    // Efecto hover dinámico
                    card.onmouseover = () => {
                        card.style.transform = 'translateY(-5px)';
                        card.style.background = 'rgba(255, 255, 255, 0.12)';
                        card.style.borderColor = '#10b981';
                    };
                    card.onmouseout = () => {
                        card.style.transform = 'translateY(0)';
                        card.style.background = 'rgba(255, 255, 255, 0.05)';
                        card.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                    };

                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Error al cargar los estilos:', error));
    </script>

</body>
</html>
