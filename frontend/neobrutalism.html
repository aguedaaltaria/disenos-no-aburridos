<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neobrutalismo - Modern UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="neobrutalism.css">
</head>
<body>

    <!-- Botón de regreso principal con icono -->
    <a href="/" class="btn-back btn-with-icon">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver al Hub
    </a>

    <main class="neo-container">
        <h1>Neobrutalismo</h1>
        <p style="font-size: 1.2rem; margin-bottom: 2rem; font-weight: 700;">
            Crudo, audaz y sin remordimientos. Este estilo desafía la limpieza con sombras duras y alto contraste.
        </p>

        <div class="components-grid">
            <!-- Componente: Tarjeta -->
            <article class="neo-card">
                <h2>Tarjeta de Impacto</h2>
                <p>Las tarjetas no necesitan ser sutiles. Los colores vibrantes crean un choque visual intencional.</p>
            </article>

            <!-- Componente: Formulario y Botón con Icono -->
            <section style="display: flex; flex-direction: column; justify-content: center;">
                <input type="text" class="neo-input" placeholder="Escribe algo aquí..." />
                
                <button class="neo-btn btn-with-icon" style="justify-content: center;">
                    Acción Brutal
                    <!-- Icono de flecha gruesa -->
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </section>
        </div>
    </main>

</body>
</html>
